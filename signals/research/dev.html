<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research (local)</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #1b2420; background: #fff; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  textarea { flex: 1; font: inherit; padding: 8px; min-height: 60px; }
  button { font: inherit; padding: 8px 16px; }
  .ev { border-left: 3px solid #dde3df; padding: 4px 10px; margin: 6px 0; white-space: pre-wrap; }
  .progress { color: #5b6862; } .code, .code_result { font: 12px/1.4 ui-monospace, monospace; background: #f6f7f6; max-height: 260px; overflow: auto; }
  .tool_call, .tool_result { color: #0f6b5f; font-size: 13px; } .answer { border-color: #0f6b5f; font-size: 16px; }
  .error { border-color: #a3322a; color: #a3322a; } .check { font-size: 13px; } .usage { font-size: 12px; color: #5b6862; }
  .chart { border-color: #0f6b5f; overflow-x: auto; }
</style>
</head>
<body>
<h1>Research, local</h1>
<p>Not the Research tab: a bare page for trying the agent. Follow-ups stay in the same investigation; <button id="new" type="button">New investigation</button></p>
<form id="f"><textarea id="q" placeholder="Analyze 0x… BTC 15-minute trades since Nov 8: when it enters, what it pays, and its strategy."></textarea><button>Ask</button></form>
<div id="log"></div>
<script>
let sid = null, after = -1;
const log = document.getElementById('log');
const post = (u, b) => fetch(u, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(b)});
function add(cls, text) { const d = document.createElement('div'); d.className = 'ev ' + cls; d.textContent = text; log.append(d); d.scrollIntoView({block: 'nearest'}); return d; }
// Events v2 (docs/research-contract.md), drawn as a plain log: the real workspace is signals/research/static/.
const flagged = nc => Object.values((nc || {}).flagged || {}).flat().map(f => f.value_text);
function show(e) {
  const t = e.type;
  if (t === 'ask.started') add('answer', 'Q: ' + e.text);
  else if (t === 'answer.progress') add('progress', e.text);
  else if (t === 'tool.call' && e.tool === 'code') add('code', e.args.code);
  else if (t === 'tool.call') add('tool_call', '→ ' + e.tool + ' ' + JSON.stringify(e.args));
  else if (t === 'tool.result' && e.tool === 'code') add('code_result', (e.stdout || '') + (e.stderr ? '\nstderr: ' + e.stderr : ''));
  else if (t === 'tool.result') add('tool_result', '← ' + e.tool + (e.ok ? '' : ' failed') + ' ' + JSON.stringify(e.summary));
  else if (t === 'plan.proposed') add('answer', 'Plan: ' + e.title + '\n' + e.steps.map(s => '· ' + s.title + ' (' + s.source + ')').join('\n') + '\n(type "Start" to run it)');
  else if (t === 'step.status') add('tool_result', `step ${e.step_id}: ${e.status}${e.summary ? ' · ' + e.summary : ''}`);
  else if (t === 'window.summary') add('tool_result', `tile ${e.window_id}: ${e.result}, ${e.entries.length} fills, profit $${e.profit}`);
  else if (t === 'coverage') add('check', 'coverage ' + JSON.stringify(e.per_source));
  else if (t === 'window.ready') add('tool_result', `replay ${e.window_id}: ${e.trades.length} fills, book ${e.coverage.book}, chainlink ${e.coverage.chainlink}`);
  else if (t === 'view.focus') add('progress', `→ ${e.stage} ${e.window_id || ''} ${e.label || ''}`);
  else if (t === 'walkthrough.ready') add('answer', e.window_id + '\n' + e.steps.map(s => `${s.index + 1}. ${s.title}\n   Observed: ${s.observed}` + (s.inferred ? `\n   Inferred: ${s.inferred}` : '') + (s.number_check.passed ? '' : `\n   Unverified: ${flagged(s.number_check).join(', ')}`)).join('\n'));
  else if (t === 'proposal') add('check', `${e.proposal_id}: ${e.text}`);
  else if (t === 'chart') { const d = add('chart', e.title + (e.caption ? ' · ' + e.caption : '')); const c = document.createElement('div'); d.append(c); vegaEmbed(c, e.spec, {actions: false}).catch(err => c.textContent = String(err)); }
  else if (t === 'answer.card') add('answer', e.text + (e.number_check.passed ? '' : '\n\nUnverified: ' + flagged(e.number_check).join(', ')));
  else if (t === 'notice') add('check', e.text);
  else if (t === 'usage') add('usage', `${e.rounds} model calls · ${e.tool_calls} tool calls · ${e.input_tokens} in + ${e.cache_read_input_tokens} cached + ${e.output_tokens} out tokens · $${e.cost_usd} (container ${e.container_s} s)`);
  else if (t === 'error') add('error', e.message);
}
function follow() {
  const es = new EventSource(`/api/research/sessions/${sid}/events?after=${after}`);
  es.onmessage = m => { const e = JSON.parse(m.data); after = e.seq; show(e); if (e.type === 'done') es.close(); };
  es.onerror = () => es.close();
}
document.getElementById('new').onclick = () => { sid = null; after = -1; log.textContent = ''; };
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim(); if (!q) return;
  if (!sid) sid = (await (await post('/api/research/sessions', {})).json()).id;
  const r = await post(`/api/research/sessions/${sid}/ask`, {question: q});
  const body = await r.json();
  if (!r.ok) { add('error', body.detail || 'Failed'); return; }
  after = body.after; follow();
};
</script>
</body>
</html>
