<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakdowns · Signals</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<!-- The card a shared usesignals.app/breakdowns link shows on X, iMessage, Slack (like the main site's). The image's URL
     has to be absolute; its source is signals/research/og-card.html. -->
<meta name="description" content="Paste a wallet or name a trader, then ask in your own words. The agent shows its plan, then lays every trade out on a chart you can replay. Polymarket only; research, no trading.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Signals">
<meta property="og:url" content="https://usesignals.app/breakdowns">
<meta property="og:title" content="Breakdowns: paste a wallet, ask in your own words">
<meta property="og:description" content="The agent shows its plan, then lays every trade out on a chart you can replay. Polymarket only; research, no trading.">
<meta property="og:image" content="https://usesignals.app/breakdowns/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Signals Breakdowns: Paste a wallet. Ask in your own words. Polymarket only, research, no trading.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./research.css">
<script>
  // the theme the main site saved (light/dark), before anything draws
  try { const t = localStorage.getItem("signals.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  // dark unless the main site's switch chose light
</script>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px">Breakdowns need JavaScript.</p></noscript>
<script type="module" src="./js/app.js"></script>
