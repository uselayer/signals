<!doctype html>
<!-- The source of static/og.png, the card a usesignals.app/breakdowns link shows (not served: outside static/).
     Re-render from the repo root with any headless Chrome:
     chrome-headless-shell --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --allow-file-access-from-files --screenshot=signals/research/static/og.png "file://$PWD/signals/research/og-card.html" -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Host Grotesk"; src: url(../static/fonts/HostGrotesk-latin-var.woff2) format("woff2"); font-weight: 300 600; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #fafaf9; color: #111112; font-family: "Host Grotesk", sans-serif; position: relative; overflow: hidden; }
  .logo { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 16px; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: #4b3fe0; display: grid; place-items: center; }
  .name { font-size: 30px; font-weight: 500; letter-spacing: -0.3px; }
  .tag { margin-left: 4px; font-size: 22px; font-weight: 500; color: #4b3fe0; background: #e6e4fb; border-radius: 999px; padding: 6px 16px; }
  h1 { position: absolute; left: 80px; top: 186px; width: 720px; margin: 0; font-size: 68px; line-height: 1.04; font-weight: 600; letter-spacing: -2px; }
  p { position: absolute; left: 80px; top: 368px; width: 640px; margin: 0; font-size: 28px; line-height: 1.43; color: #6c6c72; }
  .chips { position: absolute; left: 80px; top: 508px; display: flex; gap: 12px; }
  .chip { font-size: 24px; background: #ececea; border-radius: 999px; padding: 11px 18px; }
  .url { position: absolute; right: 80px; top: 518px; font-size: 24px; font-weight: 500; color: #4b3fe0; }
  .chart { position: absolute; left: 820px; top: 150px; width: 300px; height: 300px; background: #fff; border: 2px solid #ececea; border-radius: 24px; }
</style></head>
<body>
  <div class="logo">
    <div class="mark"><svg width="30" height="30" viewBox="0 0 20 20" fill="#fff"><rect x="3" y="11" width="3" height="6" rx="1"/><rect x="8.5" y="7" width="3" height="10" rx="1"/><rect x="14" y="3" width="3" height="14" rx="1"/></svg></div>
    <span class="name">Signals</span><span class="tag">Breakdowns</span>
  </div>
  <h1>Paste a wallet.<br>Ask in your own words.</h1>
  <p>The agent shows its plan, then lays every trade out on a chart you can replay.</p>
  <div class="chips"><span class="chip">Polymarket only</span><span class="chip">Research, no trading</span></div>
  <span class="url">usesignals.app/breakdowns</span>
  <svg class="chart" viewBox="0 0 300 300">
    <!-- pre-open band, price to beat, a price line, the wallet's fills, and the replay cursor -->
    <rect x="24" y="24" width="44" height="252" rx="6" fill="#f3f3f1"/>
    <line x1="24" x2="276" y1="164" y2="164" stroke="#c9c9cc" stroke-width="2" stroke-dasharray="6 6"/>
    <polyline fill="none" stroke="#c8c4f4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
      points="24,190 52,178 80,184 104,160 128,170 150,140 172,150 196,112 218,124 240,96 262,104 276,84"/>
    <polyline fill="none" stroke="#4b3fe0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
      points="24,190 52,178 80,184 104,160 128,170 150,140 172,150 196,112"/>
    <line x1="196" x2="196" y1="24" y2="276" stroke="#4b3fe0" stroke-width="2" opacity=".35"/>
    <circle cx="80" cy="184" r="9" fill="#4b3fe0"/>
    <circle cx="128" cy="170" r="9" fill="#4b3fe0"/>
    <circle cx="172" cy="150" r="9" fill="#4b3fe0"/>
    <circle cx="150" cy="140" r="9" fill="#fff" stroke="#4b3fe0" stroke-width="4"/>
    <circle cx="196" cy="112" r="12" fill="#fff" stroke="#4b3fe0" stroke-width="5"/>
    <rect x="24" y="226" width="40" height="26" rx="6" fill="#e6e4fb"/>
    <rect x="72" y="226" width="40" height="26" rx="6" fill="#e6e4fb"/>
    <rect x="120" y="226" width="40" height="26" rx="6" fill="#4b3fe0"/>
  </svg>
</body></html>
