[project]
name = "signals"
version = "0.1.0"
description = "Signals: a leaderboard of Polymarket traders' track records, their profiles, a watchlist with alerts, and what buying a trade now would cost, on the uselayer SDK. Runs on your machine."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "uselayer>=0.18.0",  # client.whales: top traders, scores, copy trading (0.18.0: Polymarket trader reads on Data API v2, which v1 is retired for on 2026-10-24, outcome names keep their apostrophes; 0.17.0: search_traders, a Polymarket username lookup for "Follow a trader"; 0.16.0: preview_kalshi, a buy priced on Kalshi with no key; 0.14.0: completed_positions, Score.worst_drop, realized_by_category, Polymarket volume in dollars and trades as fills; 0.13.0: resting buys count from the middle of the book in the skill test, the stable sample, Score.unread, shared read threads; 0.12.1: a scorer's memory is bounded; 0.12.0: whales.positions, open positions in one read; 0.11.0: parlays left out before sampling, edge_verdict, tiers parlays and edge_losing, "Limited evidence"; 0.10.0: tiers from skill and record, never copying, segment_of; 0.9.0: find_wallets, every leaderboard and markets of every size; 0.8.2: best_price on copy previews; 0.8.1: copies priced at the ask, copy_entry; 0.8.0: copyable = reliably above zero, realized/unrealized, weeks with history, account with read time)
  "pyjwt[crypto]>=2.8",
]

[project.scripts]
signals = "signals.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vouching: runs Recommended's real rule for who it vouches for (tests/conftest.py)"]
